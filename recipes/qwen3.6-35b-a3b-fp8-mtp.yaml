# Recipe: Qwen/Qwen3.6-35B-A3B-FP8 with native MTP speculative decoding.
#
# Multimodal — vision tower stays loaded (no --language-model-only) so this
# instance can serve as the VLM for agentic vision workloads. 65K context
# window (vs 131K default) keeps KV-cache memory headroom comfortable while
# still being plenty for short interactive turns.
#
# Risk: official FP8 ships without MTP heads → startup error like
# "missing MTP weights". Fall back: drop --speculative-config block.

# RETEST CONFIG (2026-08-02). Purpose: find out whether the 35B's notorious
# long-context looping was caused by UNCALIBRATED fp8 KV rather than by the
# model or by MTP. Changes from the previous version of this recipe:
#   --kv-cache-dtype fp8 -> auto  (16-bit; the real change under test)
#   max_model_len 262144 -> 131072
#   preserve_thinking true -> false
#   gpu_memory_utilization 0.43 -> 0.50 (see sizing note below)
#   + HF_HUB_OFFLINE (was missing here; its absence broke a cold boot once)
#
# WHY fp8 KV IS THE SUSPECT: this FP8 checkpoint ships no attention scaling
# factors, so `--kv-cache-dtype fp8` runs with uncalibrated q_scale /
# prob_scale of 1.0 and vLLM warns "may cause accuracy issues". Degraded
# attention numerics that compound with context length is a plausible
# mechanism for loops that only appear deep into a session. Supporting
# evidence: the 27B DFlash coder ran bf16 KV (flash_attn rejects fp8) and
# never showed this failure. STILL UNVERIFIED — that is what this tests.
#
# CAUTION ON ATTRIBUTION: the loops were previously seen on the *noMTP*
# recipe (which also had fp8 KV). This recipe changes TWO things at once
# versus that config — it removes fp8 KV *and* adds MTP=2. If looping
# returns, you cannot tell which is responsible. For a clean read, test
# qwen3.6-35b-a3b-fp8-nomtp (now also 16-bit KV) FIRST.
#
# MYTH CORRECTED: the sibling noMTP recipe warns "official FP8 ships
# without MTP heads". Not true for this checkpoint — its safetensors index
# contains 1560 MTP tensors (mtp.fc.weight, mtp.layers.0.*). MTP works.
# Note those MTP layers are themselves MoE (256 experts), so enabling MTP
# costs meaningfully more weight memory than the noMTP recipe.
#
# SIZING (gmu 0.50): the noMTP recipe got ~298K KV tokens at gmu 0.43 with
# fp8 KV. Going 16-bit halves tokens-per-byte while halving max_model_len
# halves what one sequence needs, so those roughly cancel — but the MoE MTP
# module adds weight memory the old figure didn't include, hence the bump.
# This is an ESTIMATE. If startup fails with "estimated maximum model
# length ... is smaller than max_model_len", raise gmu or drop context.
# Placement: needs ~55-60 GiB free. spark-01 currently has ~67 GiB spare,
# spark-02 ~55 GiB (it also hosts the 4B), so prefer spark-01 unless you
# stop the 4B first.

recipe_version: "1"
name: Qwen36-35B-A3B-FP8-MTP
description: vLLM serving Qwen3.6-35B-A3B-FP8 with native MTP, multimodal enabled

model: Qwen/Qwen3.6-35B-A3B-FP8

container: vllm-node-tf5

mods:
  - mods/fix-qwen3.6-chat-template
  # FlashQLA: Blackwell GDN prefill kernel. DISABLED for the vLLM 0.23
  # image — its patch target (vllm/.../mamba/gdn_linear_attn.py) was
  # relocated/restructured in 0.23, so the mod fails ("missing
  # gdn_linear_attn.py") and aborts launch. Re-enable only after the
  # mod's patch path is updated for 0.23, OR confirm 0.23's native GDN
  # prefill is good enough to drop it. Still valid on the 0.19.2 image.
  # - mods/flashqla

defaults:
  port: 3040
  host: 0.0.0.0
  tensor_parallel: 1
  # gmu sized to coexist with the Qwen3-VL-30B-A3B (gmu 0.35) on
  # spark-01, leaving ~4 GiB host headroom. 0.43 yields ~12.6 GiB KV
  # (~298K tokens), enough to back the full 262K window at >1x
  # concurrency. NOTE the coupling: max_model_len and gmu move together
  # — at the old 0.36 the KV pool only backed ~76K tokens, so 262144
  # would NOT start there (vLLM refuses when KV can't hold one full
  # sequence). If you drop gmu, drop max_model_len to match; if the VL
  # is removed, gmu can go to ~0.5 for more KV/concurrency.
  gpu_memory_utilization: 0.50
  max_model_len: 131072
  # 16384. TESTED AND REVERTED from 32768 (2026-08-03). Hypothesis was that
  # 8 concurrent receipts (~3,089 prompt tok each = ~24,700) exceeded a
  # 16384 budget and were being chunked. WRONG: at 32768 mean prefill went
  # 3.61s -> 3.77s and wall clock 76s -> 77s, i.e. no change, while the KV
  # pool HALVED (65,392 -> 35,376 tokens, 1.85x -> 1.01x concurrency)
  # because vLLM sizes activation buffers from this value. Not a free knob.
  # Prefill here is compute-limited, not batching-limited.
  max_num_batched_tokens: 16384
  # 4 concurrent slots is plenty for serial agentic flows. Multiple
  # virtual-model routes (thinker, instruct, etc.) share these slots
  # rather than each spawning a separate 35B instance — see hikyaku
  # config patterns like gresh-coder vs gresh-coder-moe.
  # 16. Raised 4 -> 8 -> 16 while tuning a 51-receipt OCR batch (2026-08-03).
  # A client-side concurrency sweep at max_num_seqs=8 showed throughput DOES
  # scale with concurrency, contrary to an earlier (wrong) "saturated at 4"
  # reading:  n=4 86s | n=6 79s | n=8 67s | n=12 68s.
  # The flat spot at n=8-12 was the max_num_seqs=8 cap itself, not hardware,
  # so this is raised to 16 to find the real ceiling. Slots are a scheduler
  # limit and do NOT consume activation buffers (unlike
  # max_num_batched_tokens), so this should not cost KV.
  # KV check: ~75k tokens / ~3,089 per receipt = ~24 receipts' worth, so 16
  # concurrent fits. Re-check this ratio if request size changes.
  max_num_seqs: 16

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 1
  # Cached locally; force offline so a cold boot with no internet yet
  # doesn't crash on an HF metadata fetch (caused the 2026-06-28 boot
  # failure on :3040).
  HF_HUB_OFFLINE: 1
  # Pin the CuTe/CUTLASS DSL to this GPU's compute capability (SM121a).
  # Harmless to keep; used by tilelang/CUTLASS code paths (e.g. FlashQLA).
  CUTE_DSL_ARCH: sm_121a
  # Keep the API connection alive through multi-minute streamed
  # generations (long agentic turns / deep-context responses) so the
  # client isn't dropped mid-stream.
  VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '600'
  # FP8 MoE backend: vLLM auto-selects, and on GB10 it lands on TRITON,
  # which emits "Using default MoE config — performance might be
  # sub-optimal" (no tuned per-shape config for E=256,N=512).
  #   - VLLM_FP8_MOE_BACKEND is NOT a real vLLM env var (verified: absent
  #     from the codebase) — it is a no-op. Do not use it.
  #   - The real knob is VLLM_USE_FLASHINFER_MOE_FP8=1, but: TESTED on
  #     spark-01 2026-06-21 → HARD FAIL at startup:
  #       "NotImplementedError: Found VLLM_USE_FLASHINFER_MOE_FP8=1, but
  #        no FlashInfer FP8 MoE backend supports the configuration."
  #     Neither CUTLASS nor TRT-LLM FlashInfer FP8 MoE supports this
  #     model's shape (E=256,N=512, block-scaled fp8) on GB10/sm121a in
  #     image vllm-node-tf5 (vLLM 0.19.2rc1.dev4). Do NOT re-enable
  #     without a newer build that adds the kernel. The only lever to
  #     clear the Triton "sub-optimal config" warning is the per-shape
  #     Triton MoE tuning sweep (see KNOWLEDGE §MoE tuning).
  # VLLM_USE_FLASHINFER_MOE_FP8: '1'   # ← confirmed broken on GB10, leave off

# PREFIX CACHING: ENABLED 2026-08-03, deliberately — but the MoE corruption
# question below is STILL OPEN, not cleared. Read this before trusting it.
#
# WHAT WAS TESTED: 51-receipt OCR harness + reconciliation vs known-good,
# swept n=4/8/12/16. Result: 51 OK / 0 WARN / 0 FAIL, identical category
# counts at every level. BUT THAT PROVES NOTHING — the prefix cache logged
# 785,216 queries and ZERO hits (0.0%). Each receipt is a unique image and
# vLLM matches prefix blocks from the START of the sequence, so with the
# image early in the prompt nothing ever matched. The cache never served a
# block, so there was no opportunity for cross-request contamination.
# (Do not be misled by a high cumulative hit rate on the 27B either — that
# figure is dominated by long-lived coding conversations, not by the OCR
# sweep.) A VALID test needs a long SHARED system prompt with the varying
# content LAST, so the cache actually hits.
#
# COST ON THIS WORKLOAD: pure overhead. KV pool fell 66,464 -> 53,600
# tokens and every concurrency level got slower (n=4 81->114s, n=8 68->73s,
# n=12 64->66s, n=16 62->72s) for zero cache hits.
#
# WHY IT IS LEFT ON ANYWAY: agentic/coding flows DO have long shared
# prefixes (the dense 27B sustains ~69-76% hit rates on that traffic, worth
# ~10x on prefill), which is the workload this instance also serves. If you
# run a pure image-batch job here, turn it off for ~15% more throughput.
# If output corruption ever appears under concurrency, this flag is the
# first suspect — see the original rationale below.
#
# ORIGINAL RATIONALE (still applies unless this test clears it):
# Prefix caching was DISABLED (--no-enable-prefix-caching). It
# corrupts Qwen MoE output under concurrent shared-prefix load —
# cross-request KV-state contamination (a vendor name landing in the
# currency field, one receipt's data in another's output, token
# insertion). Confirmed 2026-06-22 by a single-variable A/B (on=corrupt,
# off=clean, N=1==N=4==N=8). A fixed sampling seed made NO difference,
# proving it's KV/prefix-cache state — not sampling RNG. Same bug class
# eugr root-caused as the 0.20 regression. Do NOT re-enable without a
# vLLM build proven clean via a single==multi acceptance test.
# See KNOWLEDGE §3 "Prefix caching corrupts Qwen MoE under concurrency".
command: |
  vllm serve Qwen/Qwen3.6-35B-A3B-FP8 \
    --served-model-name Qwen/Qwen3.6-35B-A3B-FP8 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_coder \
    --kv-cache-dtype auto \
    --load-format fastsafetensors \
    --attention-backend flashinfer \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --chat-template qwen3.6.jinja \
    --default-chat-template-kwargs '{{"preserve_thinking": false}}' \
    --speculative-config '{{"method":"qwen3_next_mtp","num_speculative_tokens":2}}' \
    -tp {tensor_parallel}
