# Recipe: Qwen/Qwen3.6-27B-FP8 + native MTP, num_speculative_tokens=3.
#
# Experimental — two variables off the prod baseline at once:
#   1. FP8 quant (the official Qwen 8-bit) instead of 4-bit INT4 —
#      precision step up; the bet is that "stressful-situation" coding
#      decisions improve with the extra bits. Costs ~25% decode speed
#      (28 GiB weights vs ~14 GiB, memory-bandwidth bound on Spark).
#   2. num_speculative_tokens=3 instead of 2.
#
#   ** num_speculative_tokens=3 has a known failure mode: output
#   looping on real agentic workloads (this is why prod is at 2 —
#   see KNOWLEDGE.md §27B). vLLM also warns that >1 runs the MTP
#   layer multiple times and may lower acceptance. Watch the
#   `Avg Draft acceptance rate` and the model's behaviour; if
#   acceptance craters or thinking loops appear, drop to 2. **
#
# Includes the chat-template fix (qwen3.6.jinja, not the stale
# unsloth.jinja the base fp8-mtp recipe still references) and the
# presence_penalty=0.1 default.

recipe_version: "1"
name: Qwen36-27B-FP8-MTP3
description: vLLM serving Qwen3.6-27B-FP8 with native MTP, num_speculative_tokens=3 (experimental)

model: Qwen/Qwen3.6-27B-FP8

container: vllm-node-tf5

mods:
  - mods/fix-qwen3.6-chat-template

defaults:
  port: 3042
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.7
  max_model_len: 262144
  max_num_batched_tokens: 32768
  max_num_seqs: 4

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 1
  HF_HUB_OFFLINE: 1

command: |
  vllm serve Qwen/Qwen3.6-27B-FP8 \
    --served-model-name Qwen/Qwen3.6-27B-FP8 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --language-model-only \
    --enable-auto-tool-choice \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_coder \
    --kv-cache-dtype fp8 \
    --load-format fastsafetensors \
    --attention-backend flashinfer \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --chat-template qwen3.6.jinja \
    --default-chat-template-kwargs '{{"preserve_thinking": true}}' \
    --speculative-config '{{"method":"qwen3_next_mtp","num_speculative_tokens":3}}' \
    --generation-config auto \
    --override-generation-config '{{"temperature":0.6,"top_p":0.95,"top_k":20,"presence_penalty":0.1,"repetition_penalty":1.0}}' \
    -tp {tensor_parallel}
