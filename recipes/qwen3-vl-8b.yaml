# Recipe: Qwen/Qwen3-VL-8B-Instruct
# Successor to Qwen2.5-VL — better grounding/detection (returns real bbox
# coords for "locate the X"), better OCR, better fine-detail reading.
# ~16 GiB bf16 weights. First-class vLLM support
# (Qwen3VLForConditionalGeneration), no --trust-remote-code.
#
# Replaces Qwen2.5-VL-3B on spark-01's vision slot (port 3041) — the 3B
# struggled on small HUD elements. Sits alongside the 35B (gmu 0.36) and
# SmolVLM2-500M (gmu 0.06); at gmu=0.30 (~36 GiB) it fits with headroom — the 8B's weights+vision tower need ~22 GiB, leaving ~14 GiB for KV.
#
# Notes:
#   - max_model_len 32768 — Qwen3-VL supports far more, but the KV cache
#     budget at gmu=0.20 sets the practical window. 32K is plenty for
#     screenshot grounding (a full-res HUD image is ~1-2K image tokens).
#     Bump gmu if you need a bigger window.
#   - For grounding: prompt Qwen-style ("Locate the X, output bbox as
#     JSON") at temperature 0. Qwen3-VL-Instruct returns coords in the
#     original image's pixel space (no resize-remapping needed).

recipe_version: "1"
name: Qwen3-VL-8B
description: vLLM serving Qwen3-VL-8B-Instruct (vision-language + grounding)

model: Qwen/Qwen3-VL-8B-Instruct

container: vllm-node-tf5

solo_only: true

mods: []

defaults:
  port: 3041
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.30
  max_model_len: 32768
  max_num_batched_tokens: 16384
  max_num_seqs: 8

env:
  HF_HUB_OFFLINE: 1

command: |
  vllm serve Qwen/Qwen3-VL-8B-Instruct \
    --served-model-name Qwen/Qwen3-VL-8B-Instruct \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --load-format fastsafetensors \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --attention-backend flashinfer \
    -tp {tensor_parallel}
