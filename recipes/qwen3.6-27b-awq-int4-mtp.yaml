# Recipe: cyankiwi/Qwen3.6-27B-AWQ-INT4 + Qwen native MTP speculative decoding
# Risk: cyankiwi's quant may have stripped the MTP heads. If startup errors with
# something about missing MTP weights, fall back to no-spec or DFlash.

recipe_version: "1"
name: Qwen36-27B-AWQ-INT4-MTP
description: vLLM serving Qwen3.6-27B-AWQ-INT4 with native MTP speculative decoding

model: cyankiwi/Qwen3.6-27B-AWQ-INT4

container: vllm-node-tf5

mods:
  - mods/fix-qwen3.5-chat-template

defaults:
  port: 3042
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.7
  max_model_len: 196608
  max_num_batched_tokens: 32768
  max_num_seqs: 8

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 1

command: |
  vllm serve cyankiwi/Qwen3.6-27B-AWQ-INT4 \
    --served-model-name Qwen/Qwen3.6-27B-AWQ-INT4 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --language-model-only \
    --enable-auto-tool-choice \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_coder \
    --kv-cache-dtype fp8 \
    --load-format fastsafetensors \
    --attention-backend flashinfer \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --chat-template unsloth.jinja \
    --default-chat-template-kwargs '{{"preserve_thinking": true}}' \
    --speculative-config '{{"method":"qwen3_next_mtp","num_speculative_tokens":2}}' \
    -tp {tensor_parallel}
