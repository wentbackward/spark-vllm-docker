# Recipe: Qwen/Qwen3.6-27B-FP8 + DFlash speculative decoding
# Draft model: z-lab/Qwen3.6-27B-DFlash (~3.3 GiB head)
# Goal: validate the 15-30% speedup people report on the NVIDIA forum.
# Solo for now — once we know DFlash works and is faster, can promote to TP=2.

recipe_version: "1"
name: Qwen36-27B-FP8-DFlash
description: vLLM serving Qwen3.6-27B-FP8 with DFlash speculative decoding

model: Qwen/Qwen3.6-27B-FP8

# vllm-node-tf5-v0728 (vLLM 0.26.1, built 2026-07-28) is REQUIRED, not
# optional: it carries PR #47914, which fixes DFlash's SWA-drafter KV
# handling (separate cache groups instead of padding-as-full-attention).
# Without it, acceptance collapses at long context (~10% @ 15K vs ~29%).
# #47914 needs the V2 model runner, which the v0728 image defaults to —
# note V2 does NOT support thinking_token_budget, so routes must not send it.
container: vllm-node-tf5-v0728

mods:
  - mods/fix-qwen3.5-chat-template

defaults:
  # 3042 (NOT 3041 — that's the VL-8B vision slot on spark-01).
  port: 3042
  host: 0.0.0.0
  tensor_parallel: 1
  # 0.61 (~74 GiB) seats ONE full 262144 sequence at ~1.1x concurrency
  # while leaving room for the VL-8B (gmu 0.14) + clone-voice on the same
  # box. Measured 2026-07-29: fixed footprint (weights + DFlash draft +
  # -O3 graphs) is ~51 GiB and one 262K sequence needs ~21 GiB of KV, so
  # 0.56 FAILS ("estimated maximum model length 201312"). Raising
  # max_model_len and gmu must move together.
  gpu_memory_utilization: 0.61
  max_model_len: 262144
  max_num_batched_tokens: 32768
  max_num_seqs: 4

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 1
  HF_HUB_OFFLINE: 1

# Notes:
# --speculative-config method=dflash with the z-lab head and 15 spec tokens
#   matches the upstream recipe author's settings.
# --generation-config vllm: NO server-side sampling defaults. All sampling
#   (temperature/top_p/top_k/penalties) is owned by hikyaku per-route clamps —
#   deliberately NOT set here, so the recipe never silently fights the proxy.
#   "vllm" also ignores the model's generation_config.json, which is what
#   historically forced an --override-generation-config to strip min_p (the
#   spec-decode path rejects min_p even at 0.0). Verified 2026-07-29:
#   Qwen3.6-27B-FP8's generation_config.json carries no min_p anyway.
# --attention-backend flash_attn + bf16 KV (no --kv-cache-dtype fp8). Reason:
#   DFlash needs non-causal attention for the draft head. flashinfer rejects
#   non-causal; flash_attn supports it but rejects fp8 KV. Pick flash_attn and
#   eat the 2x KV memory — we have headroom at 0.7 util.
command: |
  vllm serve Qwen/Qwen3.6-27B-FP8 \
    --served-model-name Qwen/Qwen3.6-27B-FP8 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --language-model-only \
    --enable-auto-tool-choice \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_coder \
    --load-format fastsafetensors \
    --attention-backend flash_attn \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --chat-template unsloth.jinja \
    --default-chat-template-kwargs '{{"preserve_thinking": false}}' \
    --speculative-config '{{"method":"dflash","model":"z-lab/Qwen3.6-27B-DFlash","num_speculative_tokens":15}}' \
    --generation-config vllm \
    -O3 \
    -tp {tensor_parallel}
