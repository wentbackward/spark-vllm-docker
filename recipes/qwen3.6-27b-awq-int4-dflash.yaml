# Recipe: cyankiwi/Qwen3.6-27B-AWQ-INT4 + DFlash speculative decoding
# Same draft model (z-lab/Qwen3.6-27B-DFlash) — token-space compatible.
# Acceptance rate may dip slightly vs FP8 base due to INT4 logit drift.
# bf16 KV (flash_attn requires it for non-causal draft attention).

recipe_version: "1"
name: Qwen36-27B-AWQ-INT4-DFlash
description: vLLM serving Qwen3.6-27B-AWQ-INT4 with DFlash speculative decoding

model: cyankiwi/Qwen3.6-27B-AWQ-INT4

container: vllm-node-tf5

mods:
  - mods/fix-qwen3.5-chat-template

defaults:
  port: 3041
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.7
  max_model_len: 262144
  max_num_batched_tokens: 32768
  max_num_seqs: 4

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 1
  HF_HUB_OFFLINE: 1

command: |
  vllm serve cyankiwi/Qwen3.6-27B-AWQ-INT4 \
    --served-model-name Qwen/Qwen3.6-27B-AWQ-INT4 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --language-model-only \
    --enable-auto-tool-choice \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_coder \
    --load-format fastsafetensors \
    --attention-backend flash_attn \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --chat-template unsloth.jinja \
    --default-chat-template-kwargs '{{"preserve_thinking": true}}' \
    --speculative-config '{{"method":"dflash","model":"z-lab/Qwen3.6-27B-DFlash","num_speculative_tokens":15}}' \
    --generation-config auto \
    --override-generation-config '{{"temperature":0.6,"top_p":0.95,"top_k":20,"presence_penalty":0.0,"repetition_penalty":1.0}}' \
    -O3 \
    -tp {tensor_parallel}
