# Recipe: cyankiwi/Qwen3.6-27B-AWQ-INT4
# AWQ INT4 community quant of Qwen3.6-27B (~14 GiB weights)
# Dense model — INT4 is ~2× faster than FP8 on Spark (memory-bandwidth bound)
# Frees memory for full 262K context

recipe_version: "1"
name: Qwen36-27B-AWQ-INT4
description: vLLM serving Qwen3.6-27B AWQ-INT4 (cyankiwi)

model: cyankiwi/Qwen3.6-27B-AWQ-INT4

container: vllm-node-tf5

mods:
  - mods/fix-qwen3.5-chat-template

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.42
  max_model_len: 262144
  max_num_batched_tokens: 16384

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 1

# Notes:
# --default-chat-template-kwargs '{"preserve_thinking": true}'
#   true  = keep all historical thinking blocks (used here for agentic CODING,
#           where the model benefits from seeing its prior reasoning chain)
#   false = strip thinking from history (lean context, preferred for orchestration agents)
command: |
  vllm serve cyankiwi/Qwen3.6-27B-AWQ-INT4 \
    --served-model-name Qwen/Qwen3.6-27B-AWQ-INT4 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-seqs 4 \
    --language-model-only \
    --enable-auto-tool-choice \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_coder \
    --kv-cache-dtype fp8 \
    --load-format fastsafetensors \
    --attention-backend flashinfer \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --chat-template unsloth.jinja \
    --default-chat-template-kwargs '{{"preserve_thinking": true}}' \
    -tp {tensor_parallel}
