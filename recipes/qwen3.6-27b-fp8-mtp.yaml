# Recipe: Qwen/Qwen3.6-27B-FP8 + Qwen native MTP speculative decoding
# Same as qwen3.6-27b-fp8.yaml but with --speculative-config qwen3_next_mtp.
# Used for benchmarking spec-decode methods on the same hardware.
# MTP uses the model's built-in multi-token prediction heads — no draft model.

recipe_version: "1"
name: Qwen36-27B-MTP
description: vLLM serving Qwen3.6-27B-FP8 with native Qwen MTP speculative decoding

model: Qwen/Qwen3.6-27B-FP8

container: vllm-node-tf5

solo_only: true

mods:
  - mods/fix-qwen3.5-chat-template

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.7
  max_model_len: 262144
  max_num_batched_tokens: 16384
  max_num_seqs: 4

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 1

command: |
  vllm serve Qwen/Qwen3.6-27B-FP8 \
    --served-model-name Qwen/Qwen3.6-27B-FP8 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --language-model-only \
    --enable-auto-tool-choice \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_coder \
    --kv-cache-dtype fp8 \
    --load-format fastsafetensors \
    --attention-backend flashinfer \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --chat-template unsloth.jinja \
    --default-chat-template-kwargs '{{"preserve_thinking": true}}' \
    --speculative-config '{{"method":"qwen3_next_mtp","num_speculative_tokens":2}}' \
    -tp {tensor_parallel}
